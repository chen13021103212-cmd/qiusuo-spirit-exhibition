<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b241d" />
    <title>精神谱系线上展厅 · 中央大厅</title>
    <link rel="stylesheet" href="./styles.css?v=20260831-final-polish" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="experience" aria-label="中国共产党人精神谱系线上空间展厅中央大厅">
      <div id="scene" aria-hidden="true"></div>

      <header class="masthead">
        <div class="brand-mark" aria-hidden="true"><span></span></div>
        <div>
          <p>求索红脉薪火实践队</p>
          <h1>精神谱系线上展厅</h1>
        </div>
      </header>

      <nav class="hall-index" aria-label="五座主题馆">
        <span class="hall-index__eyebrow" id="location-label">中央大厅</span>
        <ol id="hall-list"></ol>
      </nav>

      <button id="back-to-lobby" class="back-button" type="button" hidden>
        <span aria-hidden="true">←</span> 返回中央大厅
      </button>

      <div class="view-status" id="view-status" aria-live="polite">
        <span class="view-status__line"></span>
        <span id="status-text">拖拽环视 · WASD / 方向键行走 · 点击地面移动</span>
      </div>

      <div class="controls" aria-label="场景控制">
        <button id="reset-view" class="icon-button" type="button" aria-label="返回入口视角" title="返回入口视角">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6M12 7v5l3 2"/></svg>
        </button>
        <button id="help-toggle" class="icon-button" type="button" aria-label="查看操作说明" title="查看操作说明">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.35 2.35 0 1 1 3.6 2c-1 .65-1.4 1.1-1.4 2M12 17h.01"/></svg>
        </button>
      </div>

      <!-- 背景音乐：Sad Trio · Kevin MacLeod (incompetech.com) · CC BY 4.0 -->
      <audio id="ambient-audio" src="./assets/audio/hall-ambience.m4a" loop preload="auto" hidden></audio>
      <button id="music-toggle" class="music-toggle" type="button" aria-pressed="true" aria-label="关闭背景音乐" title="关闭背景音乐">
        <svg class="music-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <svg class="music-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M4 4l16 16"/></svg>
      </button>

      <div class="crosshair" aria-hidden="true"><span></span></div>

      <section id="loading" class="loading" aria-live="polite">
        <div class="loading__seal" aria-hidden="true"><span></span></div>
        <p>正在开启中央大厅</p>
        <div class="loading__track"><span></span></div>
      </section>

      <section id="help-panel" class="side-panel" role="dialog" aria-modal="false" aria-labelledby="help-title" hidden>
        <button class="panel-close" type="button" aria-label="关闭操作说明">×</button>
        <span class="panel-kicker">参观方式</span>
        <h2 id="help-title">在空间里慢慢走</h2>
        <div class="help-grid">
          <div><kbd>拖拽</kbd><span>环视建筑与展厅入口</span></div>
          <div><kbd>WASD / 方向键</kbd><span>在中央大厅中自由行走</span></div>
          <div><kbd>单击地面</kbd><span>平滑移动至所选位置</span></div>
          <div><kbd>单击入口</kbd><span>查看对应主题馆状态</span></div>
        </div>
      </section>

      <section id="info-panel" class="info-panel" role="dialog" aria-modal="false" aria-labelledby="info-title" hidden>
        <button class="panel-close" type="button" aria-label="关闭内容面板">×</button>
        <span id="info-kicker" class="panel-kicker"></span>
        <h2 id="info-title"></h2>
        <p id="info-copy"></p>
        <div id="info-tags" class="info-tags"></div>
        <div class="panel-actions">
          <button id="panel-enter" class="text-button text-button--primary" type="button" hidden>进入西迁精神展厅</button>
          <button id="panel-return" class="text-button" type="button">返回空间</button>
        </div>
      </section>

      <section id="exhibit-panel" class="exhibit-panel" role="dialog" aria-modal="true" aria-labelledby="exhibit-title" hidden>
        <button class="panel-close" id="exhibit-close" type="button" aria-label="返回展厅空间">×</button>
        <div class="exhibit-panel__media">
          <img id="exhibit-image" alt="" />
          <video id="exhibit-video" controls playsinline preload="metadata" hidden></video>
          <span id="exhibit-index"></span>
        </div>
        <div class="exhibit-panel__body">
          <span id="exhibit-kicker" class="panel-kicker"></span>
          <h2 id="exhibit-title"></h2>
          <p id="exhibit-copy"></p>
          <div id="exhibit-media-actions" class="exhibit-media-actions" hidden>
            <button id="exhibit-speech" class="text-button text-button--primary" type="button">播放正式宣讲</button>
            <button id="exhibit-behind-scenes" class="text-button" type="button">播放拍摄花絮</button>
          </div>
          <ul id="exhibit-points"></ul>
          <div class="exhibit-panel__actions">
            <button id="exhibit-return" class="text-button text-button--primary" type="button">返回西迁展厅</button>
            <button id="exhibit-lobby-return" class="text-button" type="button">返回中央大厅</button>
          </div>
        </div>
      </section>

      <noscript>此展厅需要启用 JavaScript 才能运行。</noscript>
    </main>
    <script type="module" src="./src/main.js?v=20260831-final-polish"></script>
  </body>
</html>
